services:
  main:
    container_name: main
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: 'America/Sao_Paulo'
      ENV_FOR_DYNACONF: 'development'
    expose:
      - "80"
    volumes:
      - .:/usr/src/app
    networks:
      - flaskk

networks:
  flaskk:
    driver: bridge
