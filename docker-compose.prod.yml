services:
  main:
    container_name: main
    image: ghcr.io/gabrielroot/flask-nu-box:latest
    environment:
      TZ: America/Sao_Paulo
      ENV_FOR_DYNACONF: development
    expose:
      - '80'
    volumes:
      - '.:/usr/src/app'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost/auth/login'); sys.exit(0 if r.getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - flaskk
networks:
  flaskk:
    driver: bridge
