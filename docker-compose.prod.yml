services:
  nubox:
    image: ${APP_IMAGE:-registry.gitlab.grwxtech.com/gabrielroot/nubox.grwxtech.com/app:latest}
    environment:
      TZ: America/Sao_Paulo
      ENV_FOR_DYNACONF: development
    expose:
      - '80'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost/auth/login'); sys.exit(0 if r.getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.arch == aarm
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
        max_failure_ratio: 0.25
        order: start-first
      rollback_config:
        parallelism: 3
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
