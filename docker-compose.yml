services:
  main:
    container_name: main
    image: ${IMAGE}
    environment:
      TZ: 'America/Sao_Paulo'
      ENV_FOR_DYNACONF: 'development'
    ports:
      - 8003:8000
    volumes:
      - .:/usr/src/app
    depends_on:
      - db
    networks:
      - flaskk

  adminer:
    container_name: adminer
    image: adminer
    ports:
      - 8084:8080
    networks:
      - flaskk
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:10-alpine
    env_file: .env
    environment:
      TZ: 'America/Sao_Paulo'
      PGTZ: 'America/Sao_Paulo'
    ports:
      - 5432:5432
    volumes:
      - ./.docker/data:/var/lib/postgresql/data
    networks:
      - flaskk

networks:
  flaskk:
    driver: bridge
