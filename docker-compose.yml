services:
  main:
    container_name: main
    image: ghcr.io/gabrielroot/nuflask-nu-box:latest
    environment:
      TZ: America/Sao_Paulo
      ENV_FOR_DYNACONF: development
    expose:
      - '80'
    volumes:
      - '.:/usr/src/app'
    networks:
      - flaskk
networks:
  flaskk:
    driver: bridge
